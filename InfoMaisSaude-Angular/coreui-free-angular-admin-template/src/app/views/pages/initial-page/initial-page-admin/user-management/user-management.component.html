<c-row>
  <c-col xs="12">
    <c-card class="mb-4">
    <c-card-header class="d-flex justify-content-between align-items-center">
        <div>
          <strong>Gerenciar Usuários</strong><br> <small>Lista de usuários cadastrados</small>
        </div>
        <div>
        <button cButton class="px-4" color="dark" (click)="goToCreateUser()">
        Cadastrar novo usuário
        </button>  
        </div>
      </c-card-header>
      <c-card-body>
        <table cTable [striped]="true" [hover]="true">
          
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Login</th>
              <th scope="col">Tipo</th>
              <th scope="col">Data de Criação</th>
            </tr>
          </thead>
          
          <tbody>
            <tr *ngFor="let user of users; let i = index">
              <th scope="row">{{ i + 1 }}</th> 
              <td>{{ user.login }}</td>
              <td>{{ user.role }}</td>
              <td>{{ user.creationDate | date:'dd/MM/yyyy HH:mm' }}</td> 
            </tr>

            <tr *ngIf="users.length === 0">
              <td colspan="4" class="text-center">Nenhum usuário encontrado.</td>
            </tr>
          </tbody>

        </table>
        
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
