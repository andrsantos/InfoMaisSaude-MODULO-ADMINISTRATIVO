<c-row class="justify-content-center">
    <c-col xs="12" lg="10" xl="8">
        <c-card class="mb-4">
            <c-card-header>
                <strong>Perfil</strong>
                <small class="text-medium-emphasis ms-2">Meus dados cadastrais</small>
            </c-card-header>
            
            <c-card-body>
                <form cForm [formGroup]="medicoForm">
                    
                    <c-row class="mb-3">
                        <c-col md="4">
                            <label cLabel for="nome">Nome</label>
                            <input cFormControl id="nome" formControlName="nome" />
                        </c-col>
                        
                        <c-col md="4">
                            <label cLabel for="especializacao">Especialização Principal</label>
                            <input cFormControl id="especializacao" formControlName="especializacao">
                        </c-col>
                        
                        <c-col md="4">
                            <label cLabel for="telefone">Telefone para contato</label>
                            <input cFormControl id="telefone" formControlName="telefone"/>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <c-col md="4">
                            <label cLabel for="login">Login</label>
                            <input cFormControl id="login" formControlName="login" placeholder="Login do médico" />
                        </c-col>
                    </c-row>

                    <c-row class="mt-4">
                        <c-col class="d-flex justify-content-end">
                            <button cButton color="primary" 
                                    [disabled]="!medicoForm.valid || !medicoForm.dirty" 
                                   (click)="solicitarAlteracaoDePerfil()" >
                                📨 Solicitar Alterações
                            </button>
                        </c-col>
                    </c-row>

                </form>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
