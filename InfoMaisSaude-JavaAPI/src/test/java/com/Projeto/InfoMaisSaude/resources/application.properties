# --- Configurações do Banco de Dados para Testes (H2) ---
# URL de conexão para um banco de dados em memória chamado 'testdb'
spring.datasource.url=jdbc:h2:mem:infomaissaudetestdb
# Driver do H2
spring.datasource.driverClassName=org.h2.Driver
# Usuário e senha do H2 (pode ser o que você quiser)
spring.datasource.username=infomaissaudetest
spring.datasource.password=password
# --- Configurações do JPA/Hibernate para Testes ---
# Dialeto do Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto=create-drop: o Hibernate criará o schema do zero quando os testes começarem
spring.jpa.hibernate.ddl-auto=create-drop
# Mostra o SQL gerado no console (ótimo para debug)
spring.jpa.show-sql=true
# Habilita o console web do H2
spring.h2.console.enabled=true
# Define o caminho para acessar o console (ex: http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console