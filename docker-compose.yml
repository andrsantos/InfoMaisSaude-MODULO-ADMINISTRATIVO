services:
  db-saude:
    image: postgres:15-alpine
    container_name: info-saude-db
    restart: always
    environment:
      - POSTGRES_DB=infosaude
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=senha
    ports:
      - "5433:5432" 
    volumes:
      - pgdata_saude:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d infosaude"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-saude:
    build: ./InfoMaisSaude-JavaAPI
    container_name: info-saude-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db-saude:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-saude:5432/infosaude
      - SPRING_DATASOURCE_USERNAME=usuario
      - SPRING_DATASOURCE_PASSWORD=senha
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update 

  web-saude:
    build: ./InfoMaisSaude-Angular/coreui-free-angular-admin-template
    container_name: info-saude-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-saude

volumes:
  pgdata_saude: 